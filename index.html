<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتخابگر محصولات پلی لایت پارس شعاع</title>
  
  <style>
    /* تعریف فونت مربّع */
    @font-face {
      font-family: 'Morabba';
      src: url('MorabbaVF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(255, 255, 255, 0.25);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --item-height: 50px; /* کمی افزایش ارتفاع برای سایز جدید فونت */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, button, input, select, textarea, div, span, h1, h2, p {
      font-family: 'Morabba', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header { text-align: center; }
    .header h1 { font-size: 1.55rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }

    /* گردونه سه‌بعدی */
    .wheel-picker-wrapper {
      position: relative;
      width: 100%;
      height: 230px;
      background: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      perspective: 1000px;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .wheel-selection-indicator {
      position: absolute;
      top: calc(50% - (var(--item-height) / 2));
      left: 10px; right: 10px; height: var(--item-height);
      background: rgba(99, 102, 241, 0.12);
      border: 2px solid rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
    }

    .wheel-overlay-top, .wheel-overlay-bottom {
      position: absolute; left: 0; right: 0; height: calc(50% - (var(--item-height) / 2));
      pointer-events: none; z-index: 3;
    }
    .wheel-overlay-top { top: 0; background: linear-gradient(to bottom, rgba(248, 250, 252, 0.96) 0%, rgba(248, 250, 252, 0.4) 70%, transparent 100%); }
    .wheel-overlay-bottom { bottom: 0; background: linear-gradient(to top, rgba(248, 250, 252, 0.96) 0%, rgba(248, 250, 252, 0.4) 70%, transparent 100%); }

    .wheel-scroller { position: absolute; width: 100%; height: 100%; top: 0; left: 0; transform-style: preserve-3d; will-change: transform; }

    /* تغییرات در wheel-item: راست‌چین و بزرگتر */
    .wheel-item {
      position: absolute;
      left: 0; width: 100%; height: var(--item-height);
      top: calc(50% - (var(--item-height) / 2));
      display: flex;
      align-items: center;
      justify-content: flex-start; /* راست‌چین کردن */
      padding-right: 25px;         /* فاصله از لبه راست */
      font-size: 1.25rem;          /* سایز بزرگتر */
      font-weight: 500;
      color: #64748b;
      backface-visibility: hidden;
      transition: color 0.15s ease;
      text-align: right;
    }

    .wheel-item.selected {
      color: #4338ca;
      font-weight: 800;
      font-size: 1.4rem;           /* سایز بزرگتر برای انتخاب */
    }

    .specs-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: #f1f5f9; padding: 10px; border-radius: 14px; border: 1px solid #e2e8f0; }
    .spec-badge { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; color: #334155; background: #ffffff; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(226, 232, 240, 0.8); }
    .spec-badge.full-width { grid-column: span 2; justify-content: center; background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
    
    .result-card { width: 100%; background: #ffffff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
    .result-label { font-size: 0.88rem; color: var(--text-muted); font-weight: 500; }
    .result-value { font-size: 0.95rem; font-weight: 700; color: #1e1b4b; background: #e0e7ff; padding: 4px 12px; border-radius: 999px; border: 1px solid #c7d2fe; max-width: 60%; text-align: center; }

    .confirm-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    .toast { position: fixed; bottom: 24px; background: #0f172a; color: #fff; padding: 12px 22px; border-radius: 999px; opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>انتخاب چراغ پلی لایت</h1>
      <p>برای انتخاب مدل، گردونه را بچرخانید</p>
    </header>

    <div class="wheel-picker-wrapper" id="wheelPicker" role="listbox">
      <div class="wheel-overlay-top"></div>
      <div class="wheel-selection-indicator"></div>
      <div class="wheel-overlay-bottom"></div>
      <div class="wheel-scroller" id="wheelScroller"></div>
    </div>

    <section class="specs-panel">
      <div class="spec-badge">✨ بدون فلیکر</div>
      <div class="spec-badge">🛡️ بدنه: ABS مقاوم</div>
      <div class="spec-badge">🔧 نصب: روکار</div>
      <div class="spec-badge">📜 ۱۸ ماه گارانتی</div>
      <div class="spec-badge full-width">🌧️ حفاظت محیطی IP64</div>
    </section>

    <div class="result-card">
      <span class="result-label">محصول انتخابی:</span>
      <span class="result-value" id="selectedProductDisplay">---</span>
    </div>

    <button class="confirm-btn" id="confirmButton">تایید و مشاهده جزئیات</button>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const products = [
      { name: "چراغ پلی لایت خطی ۴ وات (مشکی)" },
      { name: "چراغ پلی لایت خطی ۶ وات (مشکی)" },
      { name: "چراغ پلی لایت خطی ۸ وات (مشکی)" },
      { name: "چراغ پلی لایت ۴ وات (سفید)" },
      { name: "چراغ پلی لایت ۴ وات (مشکی)" },
      { name: "چراغ پلی لایت ۶ وات (سفید)" },
      { name: "چراغ پلی لایت ۶ وات (مشکی)" },
      { name: "چراغ پلی لایت ۸ وات (سفید)" },
      { name: "چراغ پلی لایت ۸ وات (مشکی)" }
    ];

    const itemAngle = 24;
    const radius = 145;
    let currentIndex = 0;
    let currentRotation = 0;

    const scroller = document.getElementById('wheelScroller');
    const display = document.getElementById('selectedProductDisplay');
    const toast = document.getElementById('toast');
    const picker = document.getElementById('wheelPicker');

    products.forEach((prod, index) => {
      const item = document.createElement('div');
      item.className = `wheel-item ${index === 0 ? 'selected' : ''}`;
      item.dataset.index = index;
      item.textContent = prod.name;
      scroller.appendChild(item);
    });

    const items = scroller.querySelectorAll('.wheel-item');

    function updateWheel(rotationDeg) {
      items.forEach((item, index) => {
        const itemRotation = (index * itemAngle) + rotationDeg;
        const rad = (itemRotation * Math.PI) / 180;
        const translateY = -Math.sin(rad) * radius;
        const translateZ = Math.cos(rad) * radius - radius;
        
        const normalizedAngle = Math.abs((itemRotation % 360 + 360) % 360);
        const distance = normalizedAngle > 180 ? 360 - normalizedAngle : normalizedAngle;
        const opacity = Math.max(0.12, 1 - (distance / 75));

        item.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${itemRotation}deg)`;
        item.style.opacity = opacity;

        if (Math.abs(itemRotation) < itemAngle / 2) item.classList.add('selected');
        else item.classList.remove('selected');
      });
    }

    function setSelectedIndex(index, animate = true) {
      index = Math.max(0, Math.min(products.length - 1, index));
      currentIndex = index;
      const targetRotation = -index * itemAngle;
      if (animate) animateTo(targetRotation);
      else { currentRotation = targetRotation; updateWheel(currentRotation); display.textContent = products[currentIndex].name; }
    }

    let animationFrameId = null;
    function animateTo(target) {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      function step() {
        const diff = target - currentRotation;
        if (Math.abs(diff) < 0.2) { currentRotation = target; updateWheel(currentRotation); display.textContent = products[currentIndex].name; return; }
        currentRotation += diff * 0.18;
        updateWheel(currentRotation);
        const activeIdx = Math.round(-currentRotation / itemAngle);
        if (activeIdx >= 0 && activeIdx < products.length) display.textContent = products[activeIdx].name;
        animationFrameId = requestAnimationFrame(step);
      }
      step();
    }

    let isDragging = false, startY = 0, startRotation = 0, lastY = 0, velocity = 0, lastTime = 0;
    function onPointerDown(e) { isDragging = true; if (animationFrameId) cancelAnimationFrame(animationFrameId); startY = e.pageY || (e.touches && e.touches[0].pageY); lastY = startY; startRotation = currentRotation; lastTime = performance.now(); velocity = 0; }
    function onPointerMove(e) {
      if (!isDragging) return;
      const currentY = e.pageY || (e.touches && e.touches[0].pageY);
      const currentTime = performance.now();
      const dt = currentTime - lastTime || 16;
      velocity = (currentY - lastY) / dt;
      lastY = currentY; lastTime = currentTime;
      const newRotation = startRotation - ((currentY - startY) * 0.45);
      currentRotation = Math.max(-(products.length - 1) * itemAngle, Math.min(0, newRotation));
      updateWheel(currentRotation);
      const activeIdx = Math.round(-currentRotation / itemAngle);
      if (activeIdx >= 0 && activeIdx < products.length) display.textContent = products[activeIdx].name;
    }
    function onPointerUp() { if (!isDragging) return; isDragging = false; let targetRot = currentRotation - (velocity * 38); setSelectedIndex(Math.max(0, Math.min(products.length - 1, Math.round(-targetRot / itemAngle))), true); }

    items.forEach((item) => item.addEventListener('click', () => setSelectedIndex(parseInt(item.dataset.index, 10), true)));
    picker.addEventListener('wheel', (e) => { e.preventDefault(); setSelectedIndex(currentIndex + (e.deltaY > 0 ? 1 : -1), true); }, { passive: false });
    picker.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    picker.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);
    document.getElementById('confirmButton').addEventListener('click', () => { toast.textContent = `«${products[currentIndex].name}» انتخاب شد ✅`; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); });
    setSelectedIndex(0, false);
  </script>
</body>
</html>
