<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتخابگر محصولات پارس شعاع</title>
  
  <style>
    @font-face {
      font-family: 'Morabba';
      src: url('MorabbaVF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --item-height: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, button, input, div, span, h1, p {
      font-family: 'Morabba', -apple-system, sans-serif !important;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header { text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .header p { font-size: 0.9rem; color: var(--text-muted); }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .feature-item {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #e2e8f0;
    }

    /* Wheel Styles */
    .wheel-picker-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background: #f1f5f9;
      border-radius: 16px;
      overflow: hidden;
      perspective: 1000px;
      touch-action: none;
    }

    .wheel-selection-indicator {
      position: absolute;
      top: calc(50% - (var(--item-height) / 2));
      left: 8px; right: 8px; height: var(--item-height);
      background: rgba(99, 102, 241, 0.1);
      border: 2px solid #6366f1;
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
    }

    .wheel-scroller { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
    .wheel-item {
      position: absolute; width: 100%; height: var(--item-height);
      top: calc(50% - (var(--item-height) / 2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: #94a3b8; backface-visibility: hidden;
      transition: color 0.2s; padding: 0 10px;
    }
    .wheel-item.selected { color: #1e1b4b; font-weight: 800; font-size: 1.25rem; }

    .confirm-btn {
      width: 100%; padding: 14px;
      background: #4f46e5; color: white;
      border: none; border-radius: 14px;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>انتخاب محصول</h1>
      <p>محصول مورد نظر خود را انتخاب کنید</p>
    </header>

    <!-- بخش ویژگی‌ها -->
    <div class="features-grid">
      <div class="feature-item">✅ بدون فلیکر</div>
      <div class="feature-item">✅ بدنه: ABS</div>
      <div class="feature-item">✅ ۱۸ ماه گارانتی</div>
      <div class="feature-item">✅ نصب: روکار</div>
      <div class="feature-item" style="grid-column: span 2; justify-content: center;">🌧 دارای استاندارد IP64</div>
    </div>

    <div class="wheel-picker-wrapper" id="wheelPicker">
      <div class="wheel-selection-indicator"></div>
      <div class="wheel-scroller" id="wheelScroller"></div>
    </div>

    <button class="confirm-btn" id="confirmButton">تایید و مشاهده</button>
  </main>

  <script>
    const products = [
      { name: "چراغ پلی لایت خطی 4 وات" },
      { name: "چراغ پلی لایت خطی 6 وات" },
      { name: "چراغ پلی لایت خطی 8 وات" },
      { name: "چراغ پلی لایت 4 وات (سفید)" },
      { name: "چراغ پلی لایت 4 وات (مشکی)" },
      { name: "چراغ پلی لایت 6 وات (سفید)" },
      { name: "چراغ پلی لایت 6 وات (مشکی)" },
      { name: "چراغ پلی لایت 8 وات (سفید)" },
      { name: "چراغ پلی لایت 8 وات (مشکی)" }
    ];

    const itemAngle = 28;
    const radius = 120;
    let currentIndex = 0;
    let currentRotation = 0;

    const scroller = document.getElementById('wheelScroller');
    
    products.forEach((prod, index) => {
      const item = document.createElement('div');
      item.className = `wheel-item ${index === 0 ? 'selected' : ''}`;
      item.textContent = prod.name;
      scroller.appendChild(item);
    });

    const items = scroller.querySelectorAll('.wheel-item');

    function updateWheel(rotationDeg) {
      items.forEach((item, index) => {
        const itemRotation = (index * itemAngle) + rotationDeg;
        const rad = (itemRotation * Math.PI) / 180;
        const translateY = -Math.sin(rad) * radius;
        const translateZ = Math.cos(rad) * radius - radius;
        
        item.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${itemRotation}deg)`;
        item.style.opacity = Math.max(0.1, 1 - Math.abs(itemRotation / 90));
        
        if (Math.abs(itemRotation) < itemAngle / 2) item.classList.add('selected');
        else item.classList.remove('selected');
      });
    }

    // Logic for rotation... (same as previous optimized code)
    // Pointer/Touch events omitted here for brevity in response, 
    // but ensure you include the event listeners from previous code.
    
    // Simple set rotation to load
    updateWheel(0);
  </script>
</body>
</html>
