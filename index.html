<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پارس شعاع - انتخاب پلی‌لایت</title>
  
  <style>
    @font-face {
      font-family: 'Morabba';
      src: url('MorabbaVF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --brand-navy: #0C2342;
      --brand-navy-light: #184275;
      --brand-accent-glow: #38bdf8;
      --bg-dark: radial-gradient(ellipse at 50% 0%, #0C2342 0%, #06101e 50%, #02060d 100%);
      --card-bg: rgba(10, 18, 30, 0.92);
      --card-border: rgba(56, 189, 248, 0.15);
      --wheel-bg: #040913;
      --item-height: 66px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, div, span, img {
      font-family: 'Morabba', -apple-system, sans-serif !important;
    }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      border-radius: 36px;
      padding: 32px 20px;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95),
                  0 0 0 1px var(--card-border),
                  0 0 45px rgba(12, 35, 66, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 590px;
    }

    /* Top Logo */
    .top-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 96px;
    }

    .top-logo {
      max-height: 100px;
      max-width: 130px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }

    /* Huge Dark Wheel Picker */
    .wheel-picker-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      background: var(--wheel-bg);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: inset 0 3px 25px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.12);
      perspective: 1200px;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .wheel-picker-wrapper:active {
      cursor: grabbing;
    }

    /* Selection Indicator */
    .wheel-selection-indicator {
      position: absolute;
      top: calc(50% - (var(--item-height) / 2));
      left: 10px;
      right: 10px;
      height: var(--item-height);
      background: linear-gradient(90deg, rgba(12, 35, 66, 0.4) 0%, rgba(24, 66, 117, 0.5) 50%, rgba(12, 35, 66, 0.4) 100%);
      border: 2px solid rgba(56, 189, 248, 0.7);
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35), inset 0 0 16px rgba(24, 66, 117, 0.5);
      pointer-events: none;
      z-index: 1;
    }

    /* Soft top/bottom fade gradients behind text */
    .wheel-overlay-top,
    .wheel-overlay-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: calc(50% - (var(--item-height) / 2));
      pointer-events: none;
      z-index: 2;
    }

    .wheel-overlay-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(4, 9, 19, 0.92) 0%, rgba(4, 9, 19, 0.3) 70%, transparent 100%);
    }

    .wheel-overlay-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(4, 9, 19, 0.92) 0%, rgba(4, 9, 19, 0.3) 70%, transparent 100%);
    }

    /* Wheel Scroller in Front */
    .wheel-scroller {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 5;
    }

    /* Pure Sharp White Wheel Items */
    .wheel-item {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--item-height);
      top: calc(50% - (var(--item-height) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff !important;
      backface-visibility: hidden;
      transition: font-size 0.15s ease, font-weight 0.15s ease;
      direction: rtl;
    }

    .wheel-item-title {
      color: #ffffff !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    /* High-contrast Badges */
    .wheel-item-badge {
      font-size: 0.92rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-right: 12px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .wheel-item-badge.badge-white {
      background: #ffffff;
      color: #09090b;
      border: 1px solid #ffffff;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
    }

    .wheel-item-badge.badge-black {
      background: #0b1523;
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    /* Active Selected Item (Brilliant Sharp White) */
    .wheel-item.selected {
      color: #ffffff !important;
      font-weight: 900;
      font-size: 1.55rem;
      /* text-shadow: 0 0 10px #ffffff, 0 0 20px rgba(56, 189, 248, 0.8); */
    }

    .wheel-item.selected .wheel-item-badge.badge-white {
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
      transform: scale(1.08);
    }

    .wheel-item.selected .wheel-item-badge.badge-black {
      border-color: rgba(56, 189, 248, 0.9);
      color: #ffffff;
      background: #0f2544;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
      transform: scale(1.08);
    }

    /* Bottom Typo Logo */
    .bottom-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 120px;
      margin-top: 8px;
    }

    .bottom-logo {
      height: 100%;
      width: 100%;
      object-fit: contain;
      opacity: 0.95;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.2));
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="top-logo-wrap">
      <img src="logo-icon.png" alt="Pars Shoa Icon" class="top-logo">
    </div>

    <div class="wheel-picker-wrapper" id="wheelPicker" role="listbox" aria-label="فهرست محصولات">
      <div class="wheel-overlay-top"></div>
      <div class="wheel-selection-indicator"></div>
      <div class="wheel-overlay-bottom"></div>
      <div class="wheel-scroller" id="wheelScroller"></div>
    </div>

    <div class="bottom-logo-wrap">
      <img src="pst-typo.png" alt="Pars Shoa Typography" class="bottom-logo">
    </div>
  </main>

  <script>
    const products = [
      { name: "پلی‌لایت خطی ۴ وات", color: "مشکی", colorType: "black" },
      { name: "پلی‌لایت خطی ۶ وات", color: "مشکی", colorType: "black" },
      { name: "پلی‌لایت خطی ۸ وات", color: "مشکی", colorType: "black" },
      { name: "پلی‌لایت ۴ وات", color: "سفید", colorType: "white" },
      { name: "پلی‌لایت ۴ وات", color: "مشکی", colorType: "black" },
      { name: "پلی‌لایت ۶ وات", color: "سفید", colorType: "white" },
      { name: "پلی‌لایت ۶ وات", color: "مشکی", colorType: "black" },
      { name: "پلی‌لایت ۸ وات", color: "سفید", colorType: "white" },
      { name: "پلی‌لایت ۸ وات", color: "مشکی", colorType: "black" }
    ];

    const itemAngle = 23;
    const radius = 220;
    let currentIndex = 0;
    let currentRotation = 0;

    const scroller = document.getElementById('wheelScroller');
    const picker = document.getElementById('wheelPicker');

    products.forEach((prod, index) => {
      const item = document.createElement('div');
      item.className = `wheel-item ${index === 0 ? 'selected' : ''}`;
      item.dataset.index = index;

      const title = document.createElement('span');
      title.className = 'wheel-item-title';
      title.textContent = prod.name;

      const badge = document.createElement('span');
      badge.className = `wheel-item-badge badge-${prod.colorType}`;
      badge.textContent = prod.color;

      item.appendChild(title);
      item.appendChild(badge);
      scroller.appendChild(item);
    });

    const items = scroller.querySelectorAll('.wheel-item');

    function updateWheel(rotationDeg) {
      items.forEach((item, index) => {
        const itemRotation = (index * itemAngle) + rotationDeg;
        const rad = (itemRotation * Math.PI) / 180;
        
        const translateY = -Math.sin(rad) * radius;
        const translateZ = Math.cos(rad) * radius - radius;

        const normalizedAngle = Math.abs((itemRotation % 360 + 360) % 360);
        const distance = normalizedAngle > 180 ? 360 - normalizedAngle : normalizedAngle;
        
        const opacity = Math.max(0.35, 1 - (distance / 80));

        item.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${itemRotation}deg)`;
        item.style.opacity = opacity;

        if (Math.abs(itemRotation) < itemAngle / 2) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    function setSelectedIndex(index, animate = true) {
      index = Math.max(0, Math.min(products.length - 1, index));
      currentIndex = index;
      const targetRotation = -index * itemAngle;

      if (animate) {
        animateTo(targetRotation);
      } else {
        currentRotation = targetRotation;
        updateWheel(currentRotation);
      }
    }

    let animationFrameId = null;
    function animateTo(target) {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      
      function step() {
        const diff = target - currentRotation;
        if (Math.abs(diff) < 0.2) {
          currentRotation = target;
          updateWheel(currentRotation);
          return;
        }
        currentRotation += diff * 0.18;
        updateWheel(currentRotation);
        animationFrameId = requestAnimationFrame(step);
      }
      step();
    }

    // Touch & Mouse Drag Physics
    let isDragging = false;
    let startY = 0;
    let startRotation = 0;
    let lastY = 0;
    let velocity = 0;
    let lastTime = 0;

    function onPointerDown(e) {
      isDragging = true;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      startY = e.pageY || (e.touches && e.touches[0].pageY);
      lastY = startY;
      startRotation = currentRotation;
      lastTime = performance.now();
      velocity = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentY = e.pageY || (e.touches && e.touches[0].pageY);
      const currentTime = performance.now();
      const dt = currentTime - lastTime || 16;
      
      velocity = (currentY - lastY) / dt;
      lastY = currentY;
      lastTime = currentTime;

      const deltaY = currentY - startY;
      const newRotation = startRotation - (deltaY * 0.35);
      const minRotation = -(products.length - 1) * itemAngle;
      const maxRotation = 0;

      if (newRotation > maxRotation) {
        currentRotation = maxRotation + (newRotation - maxRotation) * 0.25;
      } else if (newRotation < minRotation) {
        currentRotation = minRotation + (newRotation - minRotation) * 0.25;
      } else {
        currentRotation = newRotation;
      }

      updateWheel(currentRotation);
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      let targetRot = currentRotation - (velocity * 35);
      let targetIndex = Math.round(-targetRot / itemAngle);
      targetIndex = Math.max(0, Math.min(products.length - 1, targetIndex));
      
      setSelectedIndex(targetIndex, true);
    }

    items.forEach((item) => {
      item.addEventListener('click', () => {
        setSelectedIndex(parseInt(item.dataset.index, 10), true);
      });
    });

    picker.addEventListener('wheel', (e) => {
      e.preventDefault();
      setSelectedIndex(currentIndex + (e.deltaY > 0 ? 1 : -1), true);
    }, { passive: false });

    picker.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    picker.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    setSelectedIndex(0, false);
  </script>
</body>
</html>
